[project]
name = "listn"
version = "0.5.0"
description = "Local-only meeting transcription for macOS. A menu bar app captures system audio and the microphone; Whisper runs on this machine."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<0.6",
    "faster-whisper>=1.1,<2",
    "av>=12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Apple Silicon GPU backend; usually the fastest choice on M-series Macs.
mlx = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Local notes and Q&A. The default Qwen3-30B-A3B-Instruct 4-bit is about 17 GB; Qwen2.5-7B 4-bit is 4.3 GB.
llm = ["mlx-lm>=0.20,<0.30; sys_platform == 'darwin' and platform_machine == 'arm64'"]
openai = ["openai-whisper>=20240930"]
# Speaker labels and voice matching. pyannote 4 needs torch 2.8+. Audio is
# handed over in memory, so torchcodec's FFmpeg decoding is never used, but
# torchcodec releases are built for one torch release each: 0.7 is torch 2.8.
# Raise torch, torchaudio and torchcodec together.
diarize = ["pyannote.audio>=4.0.1,<5", "torch>=2.8", "torchaudio>=2.8", "torchcodec>=0.7,<0.8"]
# KDE Plasma / SNI tray over D-Bus (no Qt needed).
tray = ["dbus-next>=0.2,<1"]

[project.scripts]
listn = "listn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "dbus-next>=0.2,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listn"]

[tool.setuptools.package-data]
listn = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
