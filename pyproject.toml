[project]
name = "listn"
version = "0.5.0"
description = "Local-only meeting transcription for macOS. A menu bar app captures system audio and the microphone; Whisper runs on this machine."
readme = "README.md"
# Floor raised 3.10 -> 3.11 (security t_896f56fb): on 3.10 the only
# installable filelock (4.1.0) and pillow (12.3.0) carry 59 advisories whose
# fixes (filelock 4.2.1, pillow 13.0.0) both require >=3.11 — no clean
# release exists for 3.10, and CI never exercised 3.10.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<0.6",
    "faster-whisper>=1.1,<2",
    "av>=12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.12",
    # Security (t_179dea5f): opentelemetry-api reaches the base env transitively
    # via fastapi (>=1.44.0) and pyannote.audio (>=1.34.0), and 1.45.1 carries
    # CVE-2026-126360 (fix 1.45.2). Pin the floor so re-locks cannot regress.
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
# Apple Silicon GPU backend; usually the fastest choice on M-series Macs.
mlx = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Local notes and Q&A. The default Qwen3-30B-A3B-Instruct 4-bit is about 17 GB; Qwen2.5-7B 4-bit is 4.3 GB.
llm = ["mlx-lm>=0.20,<0.30; sys_platform == 'darwin' and platform_machine == 'arm64'"]
openai = ["openai-whisper>=20240930"]
# Speaker labels and voice matching. pyannote 4 needs torch 2.8+.
# F1 (security t_b0cc2fd8): torch >=2.13 clears all fixable OSV advisories on
# 2.8.0 incl. the checkpoint RCE (CVE-2026-24747); only CVE-2026-4538
# (PYSEC-2026-139) is unfixed upstream. torchaudio tops out at 2.11.1 on PyPI
# (declares torch>=2.11); torchcodec 0.14+ targets torch>=2.11 — so the three
# move together as a set: torch 2.13+, torchaudio 2.11+, torchcodec 0.12+.
# Audio is handed over in memory, so torchcodec's FFmpeg decoding is never used.
diarize = ["pyannote.audio>=4.0.1,<5", "torch>=2.13", "torchaudio>=2.11", "torchcodec>=0.12,<0.18"]
# KDE Plasma / SNI tray over D-Bus (no Qt needed).
tray = ["dbus-next>=0.2,<1"]

[project.scripts]
listn = "listn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "dbus-next>=0.2,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listn"]

[tool.setuptools.package-data]
listn = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
