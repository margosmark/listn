[project]
name = "listn"
version = "0.3.0"
description = "Local-only meeting transcription for macOS. A menu bar app captures system audio and the microphone; Whisper runs on this machine."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<0.6",
    "faster-whisper>=1.1,<2",
    "av>=12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Apple Silicon GPU backend; usually the fastest choice on M-series Macs.
mlx = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Local notes and Q&A. Qwen2.5-7B-Instruct 4-bit is about 4.3 GB.
llm = ["mlx-lm>=0.20,<0.30; sys_platform == 'darwin' and platform_machine == 'arm64'"]
openai = ["openai-whisper>=20240930"]
# pyannote 3.x uses torchaudio I/O APIs that were removed in torchaudio 2.9.
diarize = ["pyannote.audio>=3.3.2,<4", "torch>=2.2,<2.9", "torchaudio>=2.2,<2.9"]

[project.scripts]
listn = "listn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listn"]

[tool.setuptools.package-data]
listn = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
