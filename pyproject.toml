[project]
name = "listn"
version = "0.2.0"
description = "Local-only system audio transcription for macOS (BlackHole + Whisper) with a localhost web UI."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<0.6",
    "faster-whisper>=1.1,<2",
    "av>=12",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Apple Silicon GPU backend; usually the fastest choice on M-series Macs.
mlx = ["mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
openai = ["openai-whisper>=20240930"]
# pyannote 3.x uses torchaudio I/O APIs that were removed in torchaudio 2.9.
diarize = ["pyannote.audio>=3.3.2,<4", "torch>=2.2,<2.9", "torchaudio>=2.2,<2.9"]

[project.scripts]
listn = "listn.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["listn"]

[tool.setuptools.package-data]
listn = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
